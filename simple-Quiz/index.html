<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz-App</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family:'Inter', sans-serif ;
        }
        body{
            overflow: hidden;
            background-color: #001e4d;
            height: 100vh;
            width: 100vw;
        }
        .app{
            background-color: white;
            width:90%;
            max-width: 600px;
            margin: 100px auto;
            border-radius: 10px;
            padding:30px;
        }
        .app h1{
            font-size: 25px;
            color: #001e4d;
            font-weight: 600;
            border-bottom: 1px solid #333;
            padding-bottom: 30px;
        }
        .quiz{
            padding:20px 0;
            gap:15px;
        }
        .quiz h2{
            font-size: 18px;
            color: #001e4d;
            font-weight: 600;
        }
        .btn{
            background-color: #fff;
            color:#222;
            font-weight: 500;
            width: 100%;
            border:1px solid #222;
            padding:10px;
            margin:10px 0;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover([disabeld]){
            background-color: #222;
            color: white;
        }
        .btn:disabled{
            cursor: no-drop;
        }
        #next-btn{
            background: #001e4d;
            color:white;
            width: 140px;
            border: 0;
            padding:10px 10px;
            margin: 20px auto;         
            cursor: pointer;
            display: none  ;
            border-radius: 4px;
            text-align: center;
        }
        #next-btn:hover{
            background-color:#001e4df3;
        }
        .correct{
            background-color: #9aeabc;
        }
        .incorrect{
            background-color: #ff9393;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>Simple Quiz</h1>
        <div class="quiz">
            <h2 id="question" >Question goes here</h2>
            <div class="answers-button">
                <button class="btn">Answer 1</button>
                <button class="btn">Answer 2</button>
                <button class="btn">Answer 3</button>
                <button class="btn">Answer 4</button>
            </div>
            <button id="next-btn">Next</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
