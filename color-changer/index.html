<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding: 0%;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: columun;
            background-color:#ffff;
            justify-content: center;
            align-items: center;
        }
        .container{
            height: 400px;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap:2rem;
            padding: 2rem;
            /* border:2px solid black; */
            border-radius: 7px;
            font-family:'Inter', sans-serif;
            font-size: 0.9rem;
        }
        h1{
            text-align: center;
        }
        .colorbox{
            height: 150px;
            width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 4rem;
            gap:10px;

        }
        #aquamarine{
            height: 100px;
            width: 600px;
            background-color: aquamarine;
            border:1px solid black;
        }
        #blue{
            height: 100px;
            width: 600px;
            background-color:blue;
            border:1px solid black;
        }
        #brown{
            height: 100px;
            width: 600px;
            background-color: brown;
            border:1px solid black;
        }
        #green{
            height: 100px;
            width: 600px;
            background-color: green;
            border:1px solid black;
        }
        h2{
            text-align: center;
        }
        

    </style>
</head>
<body>
    <div class="container">
        <h1>Color Scheme Switcher</h1>

        <div class="colorbox">
        <span class="color" id="aquamarine"></span>
        <span class="color" id="blue"></span>
        <span class="color" id="brown"></span>
        <span class="color" id="green"></span>
        </div>

        <h2>Try clicking on one of the above colors 
            <span>to change the background color of this image!</span>
        </h2>
    </div>

    <script src="script.js"></script>

</body>
</html>
